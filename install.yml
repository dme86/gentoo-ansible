---
- name: Install Gentoo from the running minimal ISO
  hosts: gentoo_live
  gather_facts: true
  become: false

  vars:
    target_disk: /dev/vda
    install_root: /mnt/gentoo
    hostname: gentoo
    timezone: UTC
    desktop_user: dan
    desktop_user_password: dan
    gentoo_mirror: https://distfiles.gentoo.org
    installer_public_key_path: "{{ playbook_dir }}/.qemu/installer_ed25519.pub"

  pre_tasks:
    - name: Map the machine architecture to Gentoo
      ansible.builtin.set_fact:
        gentoo_arch: >-
          {{ 'amd64' if ansible_facts.architecture in ['x86_64', 'amd64']
             else 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
             else '' }}

    - name: Refuse unsupported architectures
      ansible.builtin.assert:
        that:
          - gentoo_arch | length > 0
          - target_disk == '/dev/vda'
          - lookup('env', 'GENTOO_INSTALL_PASSWORD') | length > 0
        fail_msg: >-
          Only native amd64/arm64 QEMU guests on /dev/vda are supported and
          GENTOO_INSTALL_PASSWORD must be set by scripts/qemu-install.sh.

    - name: Check the target disk exists
      ansible.builtin.stat:
        path: "{{ target_disk }}"
      register: target_disk_stat

    - name: Require the QEMU target disk
      ansible.builtin.assert:
        that: target_disk_stat.stat.exists
        fail_msg: "The QEMU disk {{ target_disk }} does not exist."

  tasks:
    - name: Detect an existing partition table
      ansible.builtin.command: "parted -sm {{ target_disk }} print"
      register: partition_table
      changed_when: false
      failed_when: false

    - name: Partition the fresh QEMU disk
      ansible.builtin.command: >-
        parted -s {{ target_disk }} mklabel gpt
        mkpart ESP fat32 1MiB 513MiB set 1 esp on
        mkpart ROOT btrfs 513MiB 100%
      when: partition_table.rc != 0 or ':gpt:' not in partition_table.stdout

    - name: Wait for partition devices
      ansible.builtin.command: udevadm settle
      changed_when: false

    - name: Read EFI filesystem type
      ansible.builtin.command: "blkid -o value -s TYPE {{ target_disk }}1"
      register: efi_type
      changed_when: false
      failed_when: false

    - name: Format EFI system partition
      ansible.builtin.command: "mkfs.vfat -F 32 -n EFI {{ target_disk }}1"
      when: efi_type.stdout != 'vfat'

    - name: Read root filesystem type
      ansible.builtin.command: "blkid -o value -s TYPE {{ target_disk }}2"
      register: root_type
      changed_when: false
      failed_when: false

    - name: Format root partition
      ansible.builtin.command: "mkfs.btrfs -f -L ROOT {{ target_disk }}2"
      when: root_type.stdout != 'btrfs'

    - name: Create installation mountpoint
      ansible.builtin.file:
        path: "{{ install_root }}"
        state: directory
        mode: "0755"

    - name: Mount top-level Btrfs filesystem
      ansible.builtin.command: "mount {{ target_disk }}2 {{ install_root }}"
      changed_when: true

    - name: Create root subvolume
      ansible.builtin.command: "btrfs subvolume create {{ install_root }}/@"
      args:
        creates: "{{ install_root }}/@"

    - name: Create home subvolume
      ansible.builtin.command: "btrfs subvolume create {{ install_root }}/@home"
      args:
        creates: "{{ install_root }}/@home"

    - name: Unmount top-level Btrfs filesystem
      ansible.builtin.command: "umount {{ install_root }}"
      changed_when: true

    - name: Mount root subvolume
      ansible.builtin.command: >-
        mount -o noatime,compress=zstd,space_cache=v2,subvol=@
        {{ target_disk }}2 {{ install_root }}
      changed_when: true

    - name: Create child mountpoints
      ansible.builtin.file:
        path: "{{ install_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [boot, home]

    - name: Mount EFI system partition
      ansible.builtin.command: "mount {{ target_disk }}1 {{ install_root }}/boot"
      changed_when: true

    - name: Mount home subvolume
      ansible.builtin.shell: >-
        mkdir -p {{ install_root }}/home &&
        mount -o noatime,compress=zstd,space_cache=v2,subvol=@home
        {{ target_disk }}2 {{ install_root }}/home
      args:
        executable: /bin/bash
      changed_when: true

    - name: Fetch latest systemd stage3 manifest
      ansible.builtin.uri:
        url: "{{ gentoo_mirror }}/releases/{{ gentoo_arch }}/autobuilds/current-stage3-{{ gentoo_arch }}-systemd/latest-stage3-{{ gentoo_arch }}-systemd.txt"
        return_content: true
      register: stage3_manifest

    - name: Select stage3 archive
      ansible.builtin.set_fact:
        stage3_file: >-
          {{ stage3_manifest.content.splitlines()
             | select('match', '^stage3-.*[.]tar[.](xz|zst) [0-9]+$')
             | map('regex_replace', ' .*$', '') | first }}

    - name: Download stage3 archive and checksum
      ansible.builtin.get_url:
        url: "{{ gentoo_mirror }}/releases/{{ gentoo_arch }}/autobuilds/current-stage3-{{ gentoo_arch }}-systemd/{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: "0644"
      loop:
        - "{{ stage3_file }}"
        - "{{ stage3_file }}.sha256"

    - name: Verify stage3 SHA-256 checksum
      ansible.builtin.shell: |
        set -o pipefail
        expected=$(awk '/^[0-9a-f]{64}  / { print $1; exit }' "/tmp/{{ stage3_file }}.sha256")
        printf '%s  %s\n' "$expected" "/tmp/{{ stage3_file }}" | sha256sum -c -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Extract stage3
      ansible.builtin.command: >-
        tar xpf /tmp/{{ stage3_file }} --xattrs-include=*.*
        --numeric-owner -C {{ install_root }}
      args:
        creates: "{{ install_root }}/etc/gentoo-release"

    - name: Write filesystem table
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/fstab"
        mode: "0644"
        content: |
          # Managed by Ansible
          LABEL=ROOT  /      btrfs  noatime,compress=zstd,space_cache=v2,subvol=@      0 0
          LABEL=ROOT  /home  btrfs  noatime,compress=zstd,space_cache=v2,subvol=@home  0 0
          LABEL=EFI   /boot  vfat   defaults,noatime                                   0 2

    - name: Configure hostname
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/hostname"
        content: "{{ hostname }}\n"
        mode: "0644"

    - name: Configure timezone
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ timezone }}"
        dest: "{{ install_root }}/etc/localtime"
        state: link
        force: true
        follow: false

    - name: Configure German console keyboard layout
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/vconsole.conf"
        mode: "0644"
        content: |
          KEYMAP=de

    - name: Create configuration directories
      ansible.builtin.file:
        path: "{{ install_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - etc/systemd/network
        - etc/portage/package.use
        - etc/portage/package.license
        - etc/ssh/sshd_config.d

    - name: Configure wired networking
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/systemd/network/20-wired.network"
        mode: "0644"
        content: |
          [Match]
          Name=en* eth*

          [Network]
          DHCP=yes

    - name: Configure installkernel USE flags
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/portage/package.use/installkernel"
        mode: "0644"
        content: |
          sys-apps/systemd boot
          sys-kernel/installkernel systemd-boot dracut

    - name: Configure firmware licence
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/portage/package.license/linux-firmware"
        mode: "0644"
        content: "sys-kernel/linux-firmware linux-fw-redistributable\n"

    - name: Configure installed kernel command line
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/kernel/cmdline"
        mode: "0644"
        content: "console=tty0 root=LABEL=ROOT rootfstype=btrfs rootflags=subvol=@ rw\n"

    - name: Prefer Gentoo binary packages
      ansible.builtin.blockinfile:
        path: "{{ install_root }}/etc/portage/make.conf"
        marker: "# {mark} ANSIBLE QEMU INSTALL"
        block: |
          FEATURES="${FEATURES} getbinpkg"
          EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --getbinpkg=y --usepkg=y"

    - name: Copy DNS configuration into chroot
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: "{{ install_root }}/etc/resolv.conf"
        remote_src: true
        mode: "0644"

    - name: Create chroot mountpoints
      ansible.builtin.file:
        path: "{{ install_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [proc, sys, dev, run]

    - name: Mount chroot pseudo filesystems
      ansible.builtin.shell: |
        mount -t proc proc "{{ install_root }}/proc"
        mount --rbind /sys "{{ install_root }}/sys"
        mount --make-rslave "{{ install_root }}/sys"
        mount --rbind /dev "{{ install_root }}/dev"
        mount --make-rslave "{{ install_root }}/dev"
        mount --bind /run "{{ install_root }}/run"
      args:
        executable: /bin/bash
      changed_when: true

    - name: Refresh the Portage repository snapshot
      ansible.builtin.command: >-
        chroot {{ install_root }} /bin/bash -lc 'emerge-webrsync'
      changed_when: true

    - name: Install kernel, boot and networking packages
      ansible.builtin.command: >-
        chroot {{ install_root }} /bin/bash -lc
        'emerge --noreplace sys-kernel/gentoo-kernel-bin sys-kernel/installkernel
        sys-kernel/linux-firmware sys-fs/btrfs-progs net-misc/openssh app-admin/sudo'
      changed_when: true

    - name: Create the graphical console user
      ansible.builtin.command: >-
        chroot {{ install_root }} useradd --create-home --shell /bin/bash {{ desktop_user }}
      args:
        creates: "{{ install_root }}/home/{{ desktop_user }}"

    - name: Set the graphical console user password
      ansible.builtin.command: "chroot {{ install_root }} chpasswd"
      args:
        stdin: "{{ desktop_user }}:{{ desktop_user_password }}"
      no_log: true
      changed_when: true

    - name: Create the sudoers drop-in directory
      ansible.builtin.file:
        path: "{{ install_root }}/etc/sudoers.d"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Enable sudoers drop-in configuration
      ansible.builtin.lineinfile:
        path: "{{ install_root }}/etc/sudoers"
        regexp: '^[#@]includedir\s+/etc/sudoers\.d\s*$'
        line: '@includedir /etc/sudoers.d'
        mode: "0440"

    - name: Permit the graphical console user to use sudo
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/sudoers.d/{{ desktop_user }}"
        content: "{{ desktop_user }} ALL=(ALL:ALL) ALL\n"
        owner: root
        group: root
        mode: "0440"

    - name: Validate the sudoers configuration
      ansible.builtin.command: >-
        chroot {{ install_root }} visudo -cf /etc/sudoers
      changed_when: false

    - name: Set root password
      ansible.builtin.shell: >-
        printf '%s:%s\n' root "$GENTOO_INSTALL_PASSWORD" |
        chroot {{ install_root }} chpasswd
      environment:
        GENTOO_INSTALL_PASSWORD: "{{ lookup('env', 'GENTOO_INSTALL_PASSWORD') }}"
      no_log: true
      changed_when: true

    - name: Create root SSH directory
      ansible.builtin.file:
        path: "{{ install_root }}/root/.ssh"
        state: directory
        mode: "0700"

    - name: Install root SSH key
      ansible.builtin.copy:
        dest: "{{ install_root }}/root/.ssh/authorized_keys"
        content: "{{ lookup('file', installer_public_key_path) }}\n"
        mode: "0600"

    - name: Allow root login with keys only
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/ssh/sshd_config.d/10-installer.conf"
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
        mode: "0644"

    - name: Enable installed services
      ansible.builtin.command: >-
        chroot {{ install_root }} systemctl enable
        sshd systemd-networkd systemd-resolved systemd-timesyncd
      changed_when: true

    - name: Link resolv.conf to systemd-resolved
      ansible.builtin.command: >-
        ln -sfn ../run/systemd/resolve/stub-resolv.conf
        {{ install_root }}/etc/resolv.conf
      changed_when: true

    - name: Install systemd-boot without firmware variables
      ansible.builtin.command: >-
        chroot {{ install_root }} bootctl --esp-path=/boot install --no-variables
      changed_when: true

    - name: Configure systemd-boot defaults
      ansible.builtin.copy:
        dest: "{{ install_root }}/boot/loader/loader.conf"
        mode: "0644"
        content: |
          default gentoo-*
          timeout 1
          editor no

    - name: Create graphical getty override directory
      ansible.builtin.file:
        path: "{{ install_root }}/etc/systemd/system/getty@tty1.service.d"
        state: directory
        mode: "0755"

    - name: Clear the graphical virtual terminal before each login prompt
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/systemd/system/getty@tty1.service.d/clear-screen.conf"
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=-/usr/bin/agetty --noreset - ${TERM}

    - name: Initialize machine ID on first boot
      ansible.builtin.copy:
        dest: "{{ install_root }}/etc/machine-id"
        content: ""
        mode: "0444"

  post_tasks:
    - name: Unmount chroot and installed filesystems
      ansible.builtin.shell: |
        umount -R "{{ install_root }}" || umount -lR "{{ install_root }}"
      args:
        executable: /bin/bash
      changed_when: true
