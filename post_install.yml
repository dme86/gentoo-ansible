---
##############################################################################
# Gentoo post-install – install packages, set USE flags, sync, dotfiles …
##############################################################################
- name: Gentoo post-install
  hosts: "{{ post_install_target | default('localhost') }}"
  gather_facts: true
  become: true

##############################################################################
#  Variables  (all overridable via -e key=value)
##############################################################################
  vars:
    pull:   false      # ansible-playbook … -e pull=true
    update: false      # ansible-playbook … -e update=true

    user_name: dan
    user_password: dan
    home_dir: "/home/{{ user_name }}"

    repos:
      - { repo: "https://github.com/dme86/dwm.git",         dest: "{{ home_dir }}/.dwm" }
      - { repo: "https://github.com/dme86/st.git",          dest: "{{ home_dir }}/.st" }
      - { repo: "https://github.com/dme86/.wallpapers.git", dest: "{{ home_dir }}/.wallpapers" }
      - { repo: "https://github.com/dme86/neovim.git",      dest: "{{ home_dir }}/.config/nvim" }

    testing_packages:
      - app-emulation/spice-vdagent
      - sys-cluster/k9scli
      - sys-cluster/kubectl
      - app-shells/fish
      - app-shells/fzf
      - x11-misc/dunst

    stable_packages:
      # Xorg + the libraries/tools required by the personal dwm/st builds.
      - x11-base/xorg-server
      - x11-apps/xinit
      - x11-apps/setxkbmap
      - x11-apps/xrandr
      - x11-misc/dmenu
      - x11-libs/libX11
      - x11-libs/libXft
      - x11-libs/libXinerama
      - x11-drivers/xf86-input-libinput
      - media-libs/fontconfig
      - media-fonts/hack
      - media-fonts/symbols-nerd-font
      - media-fonts/dejavu
      - virtual/pkgconfig
      - dev-build/make
      - sys-process/htop
      - app-editors/neovim
      - x11-terms/alacritty
      - dev-vcs/git
      - sys-apps/fd
      - media-gfx/feh
      - net-libs/nodejs
      - app-misc/jq
      - app-text/tree
      - sys-apps/bat
      - sys-fs/ncdu
      - app-portage/eix
      - sys-apps/ripgrep
      - app-admin/awscli

##############################################################################
#  0)  Initialise diff lists  &  detect user state
##############################################################################
  tasks:
    - name: Init empty diff lists
      set_fact:
        missing_testing: []
        missing_stable:  []

    - name: Ensure user "{{ user_name }}" exists
      user:
        name: "{{ user_name }}"
        shell: /bin/bash
        create_home: yes
        state: present
      register: user_state       # user_state.changed == true → user freshly created

    - name: Set password for {{ user_name }}
      command: chpasswd
      args:
        stdin: "{{ user_name }}:{{ user_password }}"
      no_log: true
      changed_when: true

##############################################################################
#  1)  Detect missing packages
##############################################################################
    - name: Query installed testing packages
      command: "portageq has_version / {{ item }}"
      loop: "{{ testing_packages }}"
      register: test_pkg_check
      changed_when: false
      failed_when: false
      loop_control: { label: "{{ item }}" }

    - name: Query installed stable packages
      command: "portageq has_version / {{ item }}"
      loop: "{{ stable_packages }}"
      register: stable_pkg_check
      changed_when: false
      failed_when: false
      loop_control: { label: "{{ item }}" }

    - name: Collect missing testing packages
      set_fact:
        missing_testing: >-
          {{ test_pkg_check.results
             | selectattr('rc', '!=', 0)
             | map(attribute='item')
             | list }}

    - name: Collect missing stable packages
      set_fact:
        missing_stable: >-
          {{ stable_pkg_check.results
             | selectattr('rc', '!=', 0)
             | map(attribute='item')
             | list }}

##############################################################################
#  2)  Architecture-dependent facts & Portage binhost
##############################################################################
    - name: Derive architecture-specific facts
      set_fact:
        gentoo_arch: >-
          {{ 'amd64' if ansible_facts['architecture'] in ['x86_64','amd64']
             else 'arm64' if ansible_facts['architecture'] in ['aarch64','arm64']
             else '' }}
        gentoo_keyword: >-
          {{ '~amd64' if ansible_facts['architecture'] in ['x86_64','amd64']
             else '~arm64' if ansible_facts['architecture'] in ['aarch64','arm64']
             else '' }}

    - name: Abort if architecture unsupported
      fail:
        msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}"
      when: gentoo_arch == ''

    - name: Record X11 build paths
      set_fact:
        x11_include_dir: /usr/include
        x11_library_dir: /usr/lib64

    - name: Configure binhost
      copy:
        dest: /etc/portage/binrepos.conf/gentoobinhost.conf
        content: |
          # Managed by Ansible
          [gentoobinhost]
          priority = 9999
          sync-uri = https://mirror.netcologne.de/gentoo/releases/{{ gentoo_arch }}/binpackages/23.0/{{ gentoo_arch }}/
        owner: root
        group: root
        mode: '0644'

##############################################################################
#  3)  make.conf baseline  (CHOST adjusted automatically)
##############################################################################
    - name: Ensure make.conf baseline
      copy:
        dest: /etc/portage/make.conf
        content: |
          # Managed by Ansible – edits will be overwritten
          COMMON_FLAGS="-O2 -pipe"
          CFLAGS="${COMMON_FLAGS}"
          CXXFLAGS="${COMMON_FLAGS}"
          FCFLAGS="${COMMON_FLAGS}"
          FFLAGS="${COMMON_FLAGS}"
          BINPKG_FORMAT="gpkg"
          EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --getbinpkg"
          CHOST="{{ 'x86_64-pc-linux-gnu' if gentoo_arch == 'amd64' else 'aarch64-unknown-linux-gnu' }}"
          LC_MESSAGES=C.utf8
        owner: root
        group: root
        mode: '0644'

##############################################################################
#  4)  Accept-keywords for testing packages
##############################################################################
    - name: Ensure dir-style /etc/portage/package.accept_keywords
      file:
        path: /etc/portage/package.accept_keywords
        state: directory
        mode: 0755
      when: missing_testing | length > 0

    - name: Add keyword overrides for testing packages
      lineinfile:
        path: /etc/portage/package.accept_keywords/cli-tools
        create: yes
        regexp: '^{{ item }}\s'
        line: "{{ item }} {{ gentoo_keyword }}"
      loop: "{{ missing_testing }}"
      when: missing_testing | length > 0

##############################################################################
#  5)  License exception for linux-firmware
##############################################################################
    - name: Ensure dir-style package.license
      file:
        path: /etc/portage/package.license
        state: directory
        mode: 0755

    - name: Allow redistributable firmware license
      copy:
        dest: /etc/portage/package.license/linux-firmware
        content: "sys-kernel/linux-firmware linux-fw-redistributable\n"
        mode: '0644'

##############################################################################
#  6)  Install packages that are missing
##############################################################################
    - name: Install missing testing packages
      community.general.portage:
        name: "{{ missing_testing }}"
        state: present
      when: missing_testing | length > 0

    - name: Install missing stable packages
      community.general.portage:
        name: "{{ missing_stable }}"
        state: present
      when: missing_stable | length > 0

    - name: Map Hack Nerd Font to Gentoo's split font packages
      copy:
        dest: /etc/fonts/conf.d/99-hack-nerd-font.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <!-- The dwm repo requests this family. Gentoo ships Hack and the
                 Nerd Font symbols separately, so compose them via fontconfig. -->
            <alias binding="strong">
              <family>Hack Nerd Font</family>
              <prefer>
                <family>Hack</family>
              </prefer>
              <accept>
                <family>Symbols Nerd Font Mono</family>
                <family>Symbols Nerd Font</family>
              </accept>
            </alias>
          </fontconfig>
      register: hack_nerd_font_alias

    - name: Refresh the fontconfig cache
      command: fc-cache -f
      when: hack_nerd_font_alias.changed

##############################################################################
#  7)  Configure user home & Git repos
##############################################################################
    - name: Ensure {{ user_name }} owns {{ home_dir }}
      file:
        path: "{{ home_dir }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    - name: Ensure ~/.config exists
      file:
        path: "{{ home_dir }}/.config"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    - name: Ensure ~/.local/bin exists
      file:
        path: "{{ home_dir }}/.local/bin"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    # -- Clone on first run ------------------------------------------
    - name: Clone repositories (initial)
      git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        version: HEAD
        update: no
        clone: yes
      loop: "{{ repos }}"
      become_user: "{{ user_name }}"

    # -- Pull on explicit request ------------------------------------
    - name: Pull repositories (update run)
      git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        update: yes
        force: no
      loop: "{{ repos }}"
      become_user: "{{ user_name }}"
      when: pull | bool

##############################################################################
#  8)  Build the personal X11 desktop and create the startx session
##############################################################################
    - name: Link the dwm repository into ~/.config
      file:
        src: "{{ home_dir }}/.dwm"
        dest: "{{ home_dir }}/.config/dwm"
        state: link
        follow: false
        owner: "{{ user_name }}"
        group: "{{ user_name }}"

    - name: Ensure dwm autostart and helper scripts are executable
      file:
        path: "{{ item }}"
        mode: '0755'
      loop:
        - "{{ home_dir }}/.dwm/autostart.sh"
        - "{{ home_dir }}/.dwm/scripts/audio"
        - "{{ home_dir }}/.dwm/scripts/screenshot"

    - name: Build dwm
      command:
        argv:
          - make
          - "X11INC={{ x11_include_dir }}"
          - "X11LIB={{ x11_library_dir }}"
      args:
        chdir: "{{ home_dir }}/.dwm"
      become_user: "{{ user_name }}"
      register: dwm_build
      changed_when: "'Nothing to be done' not in dwm_build.stdout"

    - name: Install dwm
      command:
        argv:
          - make
          - install
          - "X11INC={{ x11_include_dir }}"
          - "X11LIB={{ x11_library_dir }}"
      args:
        chdir: "{{ home_dir }}/.dwm"
      register: dwm_install
      changed_when: true

    - name: Build dwmblocks
      command: make dwmblocks
      args:
        chdir: "{{ home_dir }}/.dwm/dwmblocks-async"
      become_user: "{{ user_name }}"
      register: dwmblocks_build
      changed_when: "'is up to date' not in dwmblocks_build.stdout"

    - name: Install dwmblocks
      command: make install
      args:
        chdir: "{{ home_dir }}/.dwm/dwmblocks-async"
      changed_when: true

    - name: Build st
      command:
        argv:
          - make
          - "X11INC={{ x11_include_dir }}"
          - "X11LIB={{ x11_library_dir }}"
      args:
        chdir: "{{ home_dir }}/.st"
      become_user: "{{ user_name }}"
      register: st_build
      changed_when: "'Nothing to be done' not in st_build.stdout"

    - name: Install st
      command:
        argv:
          - make
          - install
          - "X11INC={{ x11_include_dir }}"
          - "X11LIB={{ x11_library_dir }}"
      args:
        chdir: "{{ home_dir }}/.st"
      changed_when: true

    - name: Create the startx session for dwm
      copy:
        dest: "{{ home_dir }}/.xinitrc"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'
        content: |
          #!/bin/sh
          # Managed by Ansible. Keep the system locale English and use a German X keyboard.
          setxkbmap de

          # UTM/SPICE clipboard integration; harmless when no SPICE channel is present.
          if command -v spice-vdagent >/dev/null 2>&1; then
              spice-vdagent &
          fi

          # Re-render feh's root pixmap whenever UTM changes the X11 geometry.
          "{{ home_dir }}/.local/bin/watch-wallpaper-resolution" &

          if command -v dbus-run-session >/dev/null 2>&1; then
              exec dbus-run-session -- dwm
          fi
          exec dwm

    - name: Install wallpaper resolution watcher
      copy:
        dest: "{{ home_dir }}/.local/bin/watch-wallpaper-resolution"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'
        content: |
          #!/bin/sh
          # feh creates a root pixmap for the current screen dimensions. Re-run
          # its saved command after RandR changes those dimensions.
          previous_geometry=

          while :; do
              geometry=$(xrandr --current 2>/dev/null |
                  awk '/^Screen 0:/ { print $8 "x" $10; exit }') || exit 0
              [ -n "$geometry" ] || exit 0

              if [ -n "$previous_geometry" ] && [ "$geometry" != "$previous_geometry" ]; then
                  # Debounce the stream of intermediate sizes during live resizing.
                  sleep 0.25
                  geometry=$(xrandr --current 2>/dev/null |
                      awk '/^Screen 0:/ { print $8 "x" $10; exit }') || exit 0
                  if [ -x "$HOME/.fehbg" ]; then
                      "$HOME/.fehbg"
                  fi
              fi

              previous_geometry=$geometry
              sleep 0.5
          done

##############################################################################
#  9)  Update Portage tree / @world on demand
##############################################################################
    - name: Sync Portage tree
      command: emerge --sync
      register: sync_out
      changed_when: "'Number of files fetched' in sync_out.stdout"
      when: update | bool

    - name: World upgrade
      command: emerge -uDN @world
      register: world_out
      changed_when: "'[ebuild' in world_out.stdout"
      when: update | bool
