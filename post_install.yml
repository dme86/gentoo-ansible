---
##############################################################################
# Gentoo post-install – install packages, set USE flags, sync, dotfiles …
##############################################################################
- name: Gentoo post-install
  hosts: "{{ post_install_target | default('localhost') }}"
  gather_facts: true
  become: true
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8

##############################################################################
#  Variables  (all overridable via -e key=value)
##############################################################################
  vars:
    pull:   false      # ansible-playbook … -e pull=true
    update: false      # ansible-playbook … -e update=true

    user_name: dan
    user_password: dan
    home_dir: "/home/{{ user_name }}"

    rst_version: "a12cd343cca8c38d586d59e216e1083938b737e7"
    tuigreet_version: "4e3a0054a51ab35242d63d5b47e503d314808c52"
    anvil_version: "66b20753830bbaaec0d60c83f9e7fad11a6ef1f7"

    repos:
      - { repo: "https://github.com/dme86/.wallpapers.git", dest: "{{ home_dir }}/.wallpapers" }
      - { repo: "https://github.com/dme86/neovim.git",      dest: "{{ home_dir }}/.config/nvim" }

    testing_packages:
      - gui-libs/greetd
      - sys-cluster/k9scli
      - sys-cluster/kubectl
      - app-shells/fish
      - app-shells/fzf

    stable_packages:
      - '>=dev-lang/rust-bin-1.95'
      - dev-libs/wayland
      - dev-libs/libinput
      - sys-auth/seatd
      - sys-apps/dbus
      - media-libs/mesa
      - x11-libs/libdrm
      - x11-libs/libxkbcommon
      - x11-misc/xkeyboard-config
      - media-libs/fontconfig
      - media-fonts/hack
      - media-fonts/symbols-nerd-font
      - media-fonts/dejavu
      - x11-themes/xcursor-themes
      - virtual/pkgconfig
      - dev-build/make
      - sys-process/htop
      - app-editors/neovim
      - dev-vcs/git
      - sys-apps/fd
      - net-libs/nodejs
      - app-misc/jq
      - app-text/tree
      - sys-apps/bat
      - sys-fs/ncdu
      - app-portage/eix
      - sys-apps/ripgrep
      - app-admin/awscli

##############################################################################
#  0)  Initialise diff lists  &  detect user state
##############################################################################
  tasks:
    - name: Init empty diff lists
      set_fact:
        missing_testing: []
        missing_stable:  []

    - name: Ensure user "{{ user_name }}" exists
      user:
        name: "{{ user_name }}"
        shell: /bin/bash
        create_home: yes
        state: present
      register: user_state       # user_state.changed == true → user freshly created

    - name: Set password for {{ user_name }}
      command: chpasswd
      args:
        stdin: "{{ user_name }}:{{ user_password }}"
      no_log: true
      changed_when: true

##############################################################################
#  1)  Detect missing packages
##############################################################################
    - name: Query installed testing packages
      command: "portageq has_version / {{ item }}"
      loop: "{{ testing_packages }}"
      register: test_pkg_check
      changed_when: false
      failed_when: false
      loop_control: { label: "{{ item }}" }

    - name: Query installed stable packages
      command: "portageq has_version / {{ item }}"
      loop: "{{ stable_packages }}"
      register: stable_pkg_check
      changed_when: false
      failed_when: false
      loop_control: { label: "{{ item }}" }

    - name: Collect missing testing packages
      set_fact:
        missing_testing: >-
          {{ test_pkg_check.results
             | selectattr('rc', '!=', 0)
             | map(attribute='item')
             | list }}

    - name: Collect missing stable packages
      set_fact:
        missing_stable: >-
          {{ stable_pkg_check.results
             | selectattr('rc', '!=', 0)
             | map(attribute='item')
             | list }}

##############################################################################
#  2)  Architecture-dependent facts & Portage binhost
##############################################################################
    - name: Derive architecture-specific facts
      set_fact:
        gentoo_arch: >-
          {{ 'amd64' if ansible_facts['architecture'] in ['x86_64','amd64']
             else 'arm64' if ansible_facts['architecture'] in ['aarch64','arm64']
             else '' }}
        gentoo_keyword: >-
          {{ '~amd64' if ansible_facts['architecture'] in ['x86_64','amd64']
             else '~arm64' if ansible_facts['architecture'] in ['aarch64','arm64']
             else '' }}

    - name: Abort if architecture unsupported
      fail:
        msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}"
      when: gentoo_arch == ''

    - name: Configure binhost
      copy:
        dest: /etc/portage/binrepos.conf/gentoobinhost.conf
        content: |
          # Managed by Ansible
          [gentoobinhost]
          priority = 9999
          sync-uri = https://mirror.netcologne.de/gentoo/releases/{{ gentoo_arch }}/binpackages/23.0/{{ gentoo_arch }}/
        owner: root
        group: root
        mode: '0644'

##############################################################################
#  3)  make.conf baseline  (CHOST adjusted automatically)
##############################################################################
    - name: Ensure make.conf baseline
      copy:
        dest: /etc/portage/make.conf
        content: |
          # Managed by Ansible – edits will be overwritten
          COMMON_FLAGS="-O2 -pipe"
          PORT_LOGDIR="/var/log/portage"
          CFLAGS="${COMMON_FLAGS}"
          CXXFLAGS="${COMMON_FLAGS}"
          FCFLAGS="${COMMON_FLAGS}"
          FFLAGS="${COMMON_FLAGS}"
          USE="wayland"
          VIDEO_CARDS="virgl"
          BINPKG_FORMAT="gpkg"
          EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} --getbinpkg"
          CHOST="{{ 'x86_64-pc-linux-gnu' if gentoo_arch == 'amd64' else 'aarch64-unknown-linux-gnu' }}"
          LC_MESSAGES=C.utf8
        owner: root
        group: root
        mode: '0644'

##############################################################################
#  4)  Accept-keywords for testing packages
##############################################################################
    - name: Ensure dir-style /etc/portage/package.accept_keywords
      file:
        path: /etc/portage/package.accept_keywords
        state: directory
        mode: 0755
      when: missing_testing | length > 0

    - name: Add keyword overrides for testing packages
      lineinfile:
        path: /etc/portage/package.accept_keywords/cli-tools
        create: yes
        regexp: '^{{ item }}\s'
        line: "{{ item }} {{ gentoo_keyword }}"
      loop: "{{ missing_testing }}"
      when: missing_testing | length > 0

##############################################################################
#  5)  License exception for linux-firmware
##############################################################################
    - name: Ensure dir-style package.license
      file:
        path: /etc/portage/package.license
        state: directory
        mode: 0755

    - name: Allow redistributable firmware license
      copy:
        dest: /etc/portage/package.license/linux-firmware
        content: "sys-kernel/linux-firmware linux-fw-redistributable\n"
        mode: '0644'

##############################################################################
#  6)  Install packages that are missing
##############################################################################
    - name: Ensure package USE directory
      file:
        path: /etc/portage/package.use
        state: directory
        mode: '0755'

    - name: Configure Wayland rendering and logind session access
      copy:
        dest: /etc/portage/package.use/anvil
        mode: '0644'
        content: |
          sys-auth/seatd systemd -elogind
          media-libs/mesa egl gbm llvm wayland
          x11-libs/libxkbcommon wayland

    - name: Install missing testing packages
      community.general.portage:
        name: "{{ missing_testing }}"
        state: present
      when: missing_testing | length > 0

    - name: Install missing stable packages
      community.general.portage:
        name: "{{ missing_stable }}"
        state: present
      when: missing_stable | length > 0

    - name: Reconcile desktop packages with their required USE flags
      command:
        argv:
          - emerge
          - --update
          - --newuse
          - --deep
          - sys-auth/seatd
          - media-libs/mesa
          - x11-libs/libxkbcommon
      changed_when: true

    - name: Map Hack Nerd Font to Gentoo's split font packages
      copy:
        dest: /etc/fonts/conf.d/99-hack-nerd-font.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>Hack Nerd Font</family>
              <prefer>
                <family>Hack</family>
              </prefer>
              <accept>
                <family>Symbols Nerd Font Mono</family>
                <family>Symbols Nerd Font</family>
              </accept>
            </alias>
          </fontconfig>
      register: hack_nerd_font_alias

    - name: Refresh the fontconfig cache
      command: fc-cache -f
      when: hack_nerd_font_alias.changed

##############################################################################
#  7)  Configure user home & Git repos
##############################################################################
    - name: Ensure {{ user_name }} owns {{ home_dir }}
      file:
        path: "{{ home_dir }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    - name: Ensure ~/.config exists
      file:
        path: "{{ home_dir }}/.config"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    - name: Ensure ~/.local/bin exists
      file:
        path: "{{ home_dir }}/.local/bin"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    # -- Clone on first run ------------------------------------------
    - name: Clone repositories (initial)
      git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        version: HEAD
        update: no
        clone: yes
      loop: "{{ repos }}"
      become_user: "{{ user_name }}"

    # -- Pull on explicit request ------------------------------------
    - name: Pull repositories (update run)
      git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        update: yes
        force: no
      loop: "{{ repos }}"
      become_user: "{{ user_name }}"
      when: pull | bool

    - name: Check whether the rst build checkout exists
      stat:
        path: "{{ home_dir }}/.local/src/rst/.git"
      register: rst_checkout

    - name: Check rst repository integrity
      command: git fsck --connectivity-only
      args:
        chdir: "{{ home_dir }}/.local/src/rst"
      become_user: "{{ user_name }}"
      register: rst_integrity
      changed_when: false
      failed_when: false
      when: rst_checkout.stat.exists

    - name: Allocate a backup directory for a damaged rst checkout
      tempfile:
        state: directory
        path: "{{ home_dir }}/.local/src"
        prefix: rst-recovery-
      become_user: "{{ user_name }}"
      register: rst_recovery
      when:
        - rst_checkout.stat.exists
        - rst_integrity.rc | default(0) != 0

    - name: Preserve the damaged rst checkout before cloning again
      command:
        argv:
          - mv
          - "{{ home_dir }}/.local/src/rst"
          - "{{ rst_recovery.path }}/checkout"
      when:
        - rst_checkout.stat.exists
        - rst_integrity.rc | default(0) != 0
      changed_when: true

    - name: Refresh rst checkout state after recovery
      stat:
        path: "{{ home_dir }}/.local/src/rst/.git"
      register: rst_checkout

    - name: Inspect local changes in the rst build checkout
      command: git status --porcelain --untracked-files=all
      args:
        chdir: "{{ home_dir }}/.local/src/rst"
      become_user: "{{ user_name }}"
      register: rst_checkout_changes
      changed_when: false
      when: rst_checkout.stat.exists

    - name: Preserve local rst changes before updating the pinned source
      command:
        argv:
          - git
          - stash
          - push
          - --include-untracked
          - --message
          - Ansible rst source update backup
      args:
        chdir: "{{ home_dir }}/.local/src/rst"
      become_user: "{{ user_name }}"
      when:
        - rst_checkout.stat.exists
        - rst_checkout_changes.stdout | default('') | length > 0
      changed_when: true

    - name: Check out the pinned rst source
      git:
        repo: https://github.com/dme86/rst.git
        dest: "{{ home_dir }}/.local/src/rst"
        version: "{{ rst_version }}"
        update: yes
      become_user: "{{ user_name }}"

    - name: Build rst
      command: cargo build --release --locked
      args:
        chdir: "{{ home_dir }}/.local/src/rst"
      environment:
        CARGO_BUILD_JOBS: "2"
      become_user: "{{ user_name }}"
      changed_when: true

    - name: Install rst terminal
      copy:
        src: "{{ home_dir }}/.local/src/rst/target/release/rst"
        dest: /usr/local/bin/rst
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Check out the pinned Anvil source
      git:
        repo: https://github.com/dme86/anvil.git
        dest: "{{ home_dir }}/.local/src/anvil"
        version: "{{ anvil_version }}"
        update: yes
      become_user: "{{ user_name }}"

    - name: Build Anvil and anvilctl
      command: cargo build --release --locked
      args:
        chdir: "{{ home_dir }}/.local/src/anvil"
      environment:
        CARGO_BUILD_JOBS: "2"
      become_user: "{{ user_name }}"
      changed_when: true

    - name: Install Anvil binaries
      copy:
        src: "{{ home_dir }}/.local/src/anvil/target/release/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      loop:
        - anvil
        - anvilctl

    - name: Ensure Anvil configuration directory exists
      file:
        path: "{{ home_dir }}/.config/anvil"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'

    - name: Initialise Anvil configuration without replacing user settings
      copy:
        src: "{{ home_dir }}/.local/src/anvil/config.toml"
        dest: "{{ home_dir }}/.config/anvil/config.toml"
        remote_src: true
        force: false
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0644'

    - name: Configure German keyboard layout
      command: /usr/local/bin/anvilctl config set input.keyboard.layout de
      environment:
        HOME: "{{ home_dir }}"
      become_user: "{{ user_name }}"
      changed_when: true

    - name: Configure rst as terminal and disable all window gaps
      command:
        argv:
          - /usr/local/bin/anvilctl
          - config
          - set
          - "{{ item.key }}"
          - "{{ item.value }}"
      loop:
        - { key: general.terminal, value: /usr/local/bin/rst }
        - { key: layout.gap, value: "0" }
        - { key: layout.outer_gap, value: "0" }
      environment:
        HOME: "{{ home_dir }}"
      become_user: "{{ user_name }}"
      changed_when: true

    - name: Validate installed Anvil configuration
      command: /usr/local/bin/anvilctl config validate
      environment:
        HOME: "{{ home_dir }}"
      become_user: "{{ user_name }}"
      changed_when: false

    - name: Install Anvil session launcher
      copy:
        dest: /usr/local/bin/start-anvil
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/sh
          set -eu
          : "${XDG_RUNTIME_DIR:?Log in locally before starting Anvil}"
          export XCURSOR_PATH="/usr/share/cursors/xorg-x11:${XCURSOR_PATH:-/usr/share/icons:/usr/share/pixmaps}"
          export XCURSOR_THEME="${XCURSOR_THEME:-whiteglass}"
          export XDG_SESSION_TYPE=wayland
          export XDG_CURRENT_DESKTOP=anvil
          export XDG_SESSION_DESKTOP=anvil
          export LIBSEAT_BACKEND=logind
          exec dbus-run-session -- /usr/local/bin/anvil

    - name: Ensure Wayland session directory exists
      file:
        path: /usr/share/wayland-sessions
        state: directory
        mode: '0755'

    - name: Register Anvil Wayland session
      copy:
        dest: /usr/share/wayland-sessions/anvil.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Name=Anvil
          Comment=Anvil Wayland compositor
          Exec=/usr/local/bin/start-anvil
          Type=Application
          DesktopNames=anvil

    - name: Check out the pinned tuigreet source
      git:
        repo: https://github.com/tuigreet/tuigreet.git
        dest: "{{ home_dir }}/.local/src/tuigreet"
        version: "{{ tuigreet_version }}"
        update: true
      become_user: "{{ user_name }}"

    - name: Build tuigreet
      command: cargo build --release --locked --bin tuigreet
      args:
        chdir: "{{ home_dir }}/.local/src/tuigreet"
      environment:
        CARGO_BUILD_JOBS: "2"
      become_user: "{{ user_name }}"
      changed_when: true

    - name: Install tuigreet
      copy:
        src: "{{ home_dir }}/.local/src/tuigreet/target/release/tuigreet"
        dest: /usr/local/bin/tuigreet
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Ensure tuigreet cache directory exists
      file:
        path: /var/cache/tuigreet
        state: directory
        owner: greetd
        group: greetd
        mode: '0755'

    - name: Configure greetd with tuigreet and Anvil
      copy:
        dest: /etc/greetd/config.toml
        owner: root
        group: root
        mode: '0644'
        backup: true
        content: |
          [terminal]
          vt = 1

          [default_session]
          command = "/usr/local/bin/tuigreet --time --remember --greeting 'Gentoo' --cmd /usr/local/bin/start-anvil"
          user = "greetd"

    - name: Remove the former shell-based Anvil autostart
      blockinfile:
        path: "{{ home_dir }}/.bash_profile"
        marker: "# {mark} ANSIBLE ANVIL SESSION"
        state: absent

    - name: Reserve tty1 for greetd without interrupting the running session
      systemd_service:
        name: getty@tty1.service
        enabled: false
        masked: true

    - name: Enable greetd for the next boot without interrupting the running session
      systemd_service:
        name: greetd.service
        enabled: true
        daemon_reload: true

##############################################################################
#  9)  Update Portage tree / @world on demand
##############################################################################
    - name: Sync Portage tree
      command: emerge --sync
      register: sync_out
      changed_when: "'Number of files fetched' in sync_out.stdout"
      when: update | bool

    - name: World upgrade
      command: emerge -uDN @world
      register: world_out
      changed_when: "'[ebuild' in world_out.stdout"
      when: update | bool
